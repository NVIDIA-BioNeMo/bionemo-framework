[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evo2-sae"
version = "0.1.0"
description = "Sparse Autoencoders for the Evo2 DNA language model"
requires-python = ">=3.10"

dependencies = [
    "sae",
    "torch>=2.0",
    "numpy>=1.20",
    "pyarrow>=23.0.0",
]

# The `evo2_sae` package (src/) holds the live inference engine + steering hook;
# scripts/ (extract, train) are standalone entry points alongside it. The FastAPI
# server + CLI (and their fastapi/uvicorn deps) are added by the serve PR (#1637).
[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sae = { workspace = true }

# Register markers locally so the recipe is self-contained: in CI/Docker the repo-root
# pytest.ini (which registers `slow`) isn't in the sparse-checkout, so without this the
# @pytest.mark.slow GPU tests raise PytestUnknownMarkWarning (and would fail --strict-markers).
[tool.pytest.ini_options]
markers = [
    "slow: GPU/integration tests that load a model (skip without CUDA + checkpoints)",
]
