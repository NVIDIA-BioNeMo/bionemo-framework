[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evo2-sae"
version = "0.1.0"
description = "Sparse Autoencoders for the Evo2 DNA language model"
requires-python = ">=3.10"

dependencies = [
    "sae",
    "torch>=2.0",
    "numpy>=1.20",
    "pyarrow>=23.0.0",
    "biopython>=1.80",  # genetic code / translation in labelers.py
    "pyrodigal>=3.0",  # prokaryotic gene calling in labelers.predict_cds / predict_codons
]

# The `evo2_sae` package (src/) holds the live inference engine + steering hook;
# scripts/ (extract, train) are standalone entry points alongside it. The FastAPI
# server + CLI (and their fastapi/uvicorn deps) are added by the serve PR (#1637).
[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sae = { workspace = true }
