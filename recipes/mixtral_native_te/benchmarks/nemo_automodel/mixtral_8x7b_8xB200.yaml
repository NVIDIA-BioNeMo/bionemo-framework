# NeMo AutoModel single-node throughput benchmark for pretrained Mixtral-8x7B.
recipe: benchmark_recipe.MixtralBenchmarkRecipe

seed: 42

benchmark:
  warmup_steps: 30
  peak_tflops: 2250
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1
  json_output_path: ${oc.env:BENCHMARK_JSON_OUTPUT}

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 5000
  val_every_steps: 5000
  num_epochs: 1
  max_steps: 60

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: model_factory.from_pretrained
  pretrained_model_name_or_path: mistralai/Mixtral-8x7B-v0.1
  mxfp8_dense: false
  torch_dtype: bf16
  force_hf: true
  # AutoModel's default Liger patch replaces the complete MixtralExperts module
  # and silently bypasses both grouped_mm and the local MXFP8 implementation.
  use_liger_kernel: false
  attn_implementation: flash_attention_2
  experts_implementation: grouped_mm
  use_cache: false
  output_router_logits: false

distributed:
  strategy: fsdp2
  dp_size: 8
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: false
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
    cast_forward_inputs: true

compile:
  enabled: true
  mode: default
  fullgraph: false
  dynamic: false
  backend: null

checkpoint:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: true

dataset:
  _target_: dataset.DCLMPackedIterableDataset
  data_files: ${oc.env:DCLM_DATA_FILE}
  seq_len: 4096
  stride: 200
  text_column: text
  tokenize_batch_size: 4
  shuffle_buffer_size: 1000
  split: train

# The dataset is already packed and shifted online. Enabling AutoModel's
# packed_sequence wrapper would eagerly materialize the streaming dataset.
packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 1
  collate_fn: dataset.packed_collater
  num_workers: 1
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true

optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  store_param_remainders: true
