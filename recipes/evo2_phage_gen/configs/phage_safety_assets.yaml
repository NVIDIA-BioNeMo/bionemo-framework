# Tracked recipe for material that is generated under data/external/safety/.
# The generated asset_manifest.yaml records observed versions, release headers,
# retrieval times, and SHA-256 digests; it is intentionally not committed.
schema_version: 1
runtime_manifest: data/external/safety/asset_manifest.yaml

amrfinder_plus:
  release: amrfinder_v4.2.7
  release_url: https://github.com/ncbi/amr/releases/download/amrfinder_v4.2.7/amrfinder_binaries_v4.2.7.tar.gz
  archive_sha256: 68045a8bccdbe3c5dcdf941bebe2352ed419758a9914c41f48f0bbbd6fbade56
  database_directory_role: pinned custom AMRFinderPlus database directory
  require_recorded_database_version: true
  require_recorded_amrfinder_index: true
  require_contained_latest_symlink: true
  citation: >-
    Feldgarden et al. (2021), AMRFinderPlus and the Reference Gene Catalog
    facilitate examination of the genomic links among antimicrobial resistance,
    stress response, and virulence, Scientific Reports 11:12728.

toxin_reference:
  provider: UniProtKB/Swiss-Prot
  query: |-
    reviewed:true AND keyword:KW-0800 AND
    (taxonomy_id:2 OR taxonomy_id:2157 OR taxonomy_id:10239)
  annotations_url: https://rest.uniprot.org/uniprotkb/stream
  fasta_url: https://rest.uniprot.org/uniprotkb/stream
  license: CC BY 4.0
  attribution: UniProt data are available under the CC BY 4.0 license.

phrogs_v4:
  annotation_url: https://phrogs.lmge.uca.fr/downloads_from_website/phrog_annot_v4.tsv
  annotation_sha256: 502f96101597c21133bcce5711803e0b95e0c162cd4e86425c352549bd95e8c2
  mmseqs_database_url: https://phrogs.lmge.uca.fr/downloads_from_website/phrogs_mmseqs_db.tar.gz
  profile_database:
    source_url: https://zenodo.org/record/17110353/files/pharokka_v1.8.0_databases.tar.gz
    release: Pharokka database v1.8.0
    dataset_release: PHROGs v4
    archive_published_sha256: null
    archive_published_md5: a63c485241b900a11989bd1821bfbb09
    archive_published_size: 656171247
    archive_digest_provenance: >-
      verify the published MD5 and size before extraction; record observed SHA-256
      at preparation; no published SHA-256 is asserted
    doi: 10.5281/zenodo.17110353
    license: CC BY 4.0
    citation: 'Pharokka database v1.8.0 (DOI: 10.5281/zenodo.17110353).'
    minimum_mmseqs_version: '14'
    built_with_mmseqs_version: 18.8cc5c
    release_marker: VERSION_1_8_0
    search_orientation: phrog_profile_query_vs_orf_target
    search_profile_scope: full_phrogs_v4_profile_database
    lookup_join_policy: classify_only_profile_ids_present_in_pinned_lookup
    output_fields: [query, target, pident, alnlen, qlen, tlen, qcov, tcov, evalue, bits]
    units: {pident: percent, qcov: fraction, tcov: fraction}
    query_id_pattern: ^phrog_[0-9]+$
    required_files:
      - phrogs_profile_db
      - phrogs_profile_db.dbtype
      - phrogs_profile_db.index
      - phrogs_profile_db.lookup
      - phrogs_profile_db.source
      - phrogs_profile_db_h
      - phrogs_profile_db_h.dbtype
      - phrogs_profile_db_h.index
      - VERSION_1_8_0
    require_complete_profile_database: true
  sequence_archive_url: https://phrogs.lmge.uca.fr/downloads_from_website/FAA_phrog.tar.gz
  integration_excision_category: integration and excision
  citation: >-
    Terzian et al. (2021), PHROG: families of prokaryotic virus proteins
    clustered using remote homology, Nucleic Acids Research 49:D1345-D1353.
  use_terms: >-
    Consult the PHROGs project download page for its published use and download
    conditions; this recipe does not assert a license.
  high_confidence_terms:
    - integrase
    - excisionase
    - site-specific recombinase
    - lysogeny repressor
  review_terms:
    - recombinase
    - repressor
    - lysogeny
    - integration
    - excision

expected_file_roles:
  amrfinder_binary: AMRFinderPlus executable from the pinned release
  amrfinder_index: AMRFinderPlus companion index executable from the pinned release
  amrfinder_updater: AMRFinderPlus database updater from the pinned release
  amrfinder_database: resolved custom AMRFinderPlus database, never an unrecorded latest alias
  toxin_annotations: canonical reviewed toxin accessions and annotations table
  toxin_fasta: reviewed toxin protein FASTA snapshot
  toxin_diamond_database: DIAMOND index built from the reviewed toxin FASTA snapshot
  phrogs_annotation: PHROGs v4 annotation source table
  phrogs_profile_database: complete PHROGs v4 MMseqs profile database for PHROG-identity safety search
  phrogs_sequence_database: complete PHROGs v4 sequence search database with all selected sidecar files
  phrogs_lysogeny_table: versioned integration/excision PHROG confidence lookup table
