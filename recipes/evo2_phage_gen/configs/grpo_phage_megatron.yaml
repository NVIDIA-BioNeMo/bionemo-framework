# Evo2 phage GRPO template for NeMo-RL.
#
# This config uses NeMo-RL's Megatron generation backend, not vLLM, because Evo2
# does not provide vLLM layers. The recipe build repairs upstream NeMo-RL package
# discovery and applies the local Evo2/MBridge patch required for this path.

defaults: "nemo_rl_defaults/grpo_math_1B_megatron.yaml"

grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 2
  max_num_steps: 10
  val_period: 0
  val_at_start: false
  val_at_end: false

loss_fn:
  reference_policy_kl_penalty: 0.01

checkpointing:
  enabled: true
  checkpoint_dir: "data/checkpoints/phage_grpo"
  pretrained_checkpoint:
    path: "data/checkpoints/evo2_7b_microviridae_mbridge"
    format: "megatron_bridge"

policy:
  # Non-HF identifier; the Evo2/MBridge patch reuses the converted policy config.
  model_name: "bionemo/evo2_7b_base"
  tokenizer:
    name: "tokenizers/nucleotide_fast_tokenizer_512"
    chat_template_kwargs: null
  train_global_batch_size: 4
  train_micro_batch_size: 1
  generation_batch_size: 8
  logprob_batch_size: 1
  max_total_sequence_length: 10240
  precision: "bfloat16"
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: false
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: true
    target_allowlist_prefixes:
      - "bionemo.evo2."
      - "bionemo.common."
  generation:
    backend: "megatron"
    max_new_tokens: 6000
    temperature: 0.8
    top_p: 0.95
    top_k: null
    mcore_generation_config:
      cuda_graph_impl: "local"
      inference_cuda_graph_scope: "block"
      use_cuda_graphs_for_non_decode_steps: true
      max_requests: 8
      evo2_batched_decode_size: 8

data:
  max_input_seq_length: 512
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "phage_prompt_data_processor"
    env_name: "phage_qc"
  train:
    dataset_name: "openai_format"
    data_path: "data/phage_prompts.jsonl"
    env_name: "phage_qc"
    prompt_file: null
    system_prompt_file: null
  validation: null

env:
  phage_qc:
    genome_length_min: 4000
    genome_length_max: 6000
    gc_content_min: 30.0
    gc_content_max: 65.0
    homopolymer_max: 10
    weight_valid_nt_chars: 1.0
    weight_genome_length: 1.0
    weight_gc_content: 1.0
    weight_nt_homopolymer: 1.0
    weight_orf: 1.0
    weight_coding_density: 1.0
    weight_protein_hit_count: 1.0
    weight_tropism: 1.0
    weight_genetic_architecture: 1.0
    weight_checkv: 1.0
    weight_synteny: 1.0
    weight_mmseqs_clustering: 1.0
    # Small normalized diversity bonus. Set to 0.0 for the diversity ablation.
    weight_diversity: 0.05
    external_qc:
      enabled: true
      config_path: "configs/arc_genome_design_filtering_local.yaml"
      pipeline_script: "data/arc_pipeline_patched/genome_design_filtering_pipeline.py"
      work_dir: "data/checkpoints/phage_grpo_external_qc"
      checkv_db_path: "data/external/checkv/checkv-db-v1.5"
      keep_artifacts: false
      enable_orf: true
      enable_coding_density: true
      enable_protein_hit_count: true
      enable_tropism: true
      enable_genetic_architecture: true
      enable_checkv: true
      enable_synteny: true
      enable_mmseqs_clustering: true
      enable_diversity: true
      diversity_quality_threshold: 0.6
      diversity_kmer_size: 8

logger:
  log_dir: "data/checkpoints/phage_grpo_logs"
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: true

cluster:
  gpus_per_node: 2
  num_nodes: 1
