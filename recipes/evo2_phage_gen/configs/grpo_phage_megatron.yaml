# Evo2 phage GRPO template for NeMo-RL.
#
# This config uses NeMo-RL's Megatron generation backend, not vLLM, because Evo2
# does not provide vLLM layers. The recipe build repairs upstream NeMo-RL package
# discovery and applies the local Evo2/MBridge patch required for this path.

defaults: "nemo_rl_defaults/grpo_math_1B_megatron.yaml"

grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 2
  max_num_steps: 10
  val_period: 0
  val_at_start: false
  val_at_end: false

loss_fn:
  reference_policy_kl_penalty: 0.01

checkpointing:
  enabled: true
  checkpoint_dir: "data/checkpoints/phage_grpo"
  pretrained_checkpoint:
    path: "data/checkpoints/evo2_7b_microviridae_mbridge"
    format: "megatron_bridge"

policy:
  # Non-HF identifier; the Evo2/MBridge patch reuses the converted policy config.
  model_name: "bionemo/evo2_7b_base"
  tokenizer:
    name: "tokenizers/nucleotide_fast_tokenizer_512"
    chat_template_kwargs: null
  train_global_batch_size: 4
  train_micro_batch_size: 1
  # Serial generation is the current known-good GRPO path for Evo2. Larger
  # prompt batches hit MCore's dynamic KV-cache append assertion during decode.
  generation_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 10240
  precision: "bfloat16"
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: false
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: true
    target_allowlist_prefixes:
      - "bionemo.evo2."
      - "bionemo.common."
  generation:
    backend: "megatron"
    # Prompt bases are included in reward/QC scoring. The bundled RL prompts are
    # `+~NNNN`, so 5996 new tokens keeps full-length genomes within the 6000 bp
    # Arc hard upper bound after adding the 4-base prompt prefix.
    max_new_tokens: 5996
    # Keep rollouts stochastic using temperature only. Top-k/top-p truncation changes
    # the sampled policy support and can make replay/reference logprobs inconsistent
    # as the policy changes; null maps to MCore top_k=0 (disabled).
    temperature: 0.8
    top_p: 1.0
    top_k: null
    mcore_generation_config:
      cuda_graph_impl: "local"
      inference_cuda_graph_scope: "block"
      use_cuda_graphs_for_non_decode_steps: true
      # Must be divisible by tensor_model_parallel_size=2 even when prompt batching is serial.
      max_requests: 2
      prompt_batch_size: 1

data:
  max_input_seq_length: 512
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "phage_prompt_data_processor"
    env_name: "phage_qc"
  train:
    dataset_name: "openai_format"
    data_path: "data/phage_prompts.jsonl"
    env_name: "phage_qc"
    prompt_file: null
    system_prompt_file: null
  validation: null

env:
  phage_qc:
    genome_length_min: 4000
    genome_length_max: 6000
    gc_content_min: 30.0
    gc_content_max: 65.0
    homopolymer_max: 10
    dustmask_filter: true
    dustmasker_bin: "dustmasker"
    dustmask_use_external: true
    dustmask_window: 64
    dustmask_level: 20.0
    dustmask_end_window: 200
    dustmask_max_end_fraction: 0.9
    weight_valid_nt_chars: 1.0
    weight_genome_length: 1.0
    weight_gc_content: 1.0
    weight_nt_homopolymer: 1.0
    weight_dustmask_end: 1.0
    weight_nucleotide_pass: 0.0
    weight_protein_hit_count: 1.0
    weight_tropism: 1.0
    # Focused quality terms are soft preferences, not hard paper-candidate gates.
    weight_synteny: 0.25
    weight_average_protein_identity: 0.25
    weight_required_genes: 0.1
    # Mandatory fail-closed Task 4 gate for the PhiX/Microviridae bacterial design context.
    # Runtime asset and tool-pin files are generated locally and digest-validated before use.
    sequence_safety:
      enabled: true
      host_domain: "BACTERIA"
      host_evidence:
        source: "NCBI Datasets v2alpha genome dataset report"
        source_version: "NC_001422.1"
        replication_host_domains: ["BACTERIA"]
        confirmed: true
        metadata:
          accession: "NC_001422.1"
          intended_design_context: "PhiX/Microviridae bacterial phage"
      asset_manifest_path: "data/external/safety/asset_manifest.yaml"
      diamond_tool_pin_path: "data/external/safety/diamond_tool_pin.json"
      mmseqs_tool_pin_path: "data/external/safety/mmseqs_tool_pin.json"
      policy_path: "configs/phage_safety_policy.yaml"
      work_dir: "data/checkpoints/phage_sequence_safety_reward"
      strict_lysis: false
      circular: true
      threads: 16
      timeout_seconds: 300.0
    external_qc:
      enabled: true
      config_path: "configs/arc_genome_design_filtering_local.yaml"
      pipeline_script: "data/arc_pipeline_patched/genome_design_filtering_pipeline.py"
      work_dir: "data/checkpoints/phage_grpo_external_qc"
      keep_artifacts: false
      fail_on_error: true
      timeout_seconds: 1800
      enable_protein_hit_count: true
      enable_tropism: true
      enable_synteny: true
      synteny_mode: "full"
      enable_average_protein_identity: true
      enable_required_genes: true
      required_genes_evidence_target: 9.0
      # Per external-QC reward run; set lower if several environment actors score concurrently.
      lovis4u_parallel_jobs: 12
      # Tune nested cluster threads with outer jobs; clustering is CPU-only in current MMseqs2.
      lovis4u_mmseqs_threads: 8
      lovis4u_metrics_only: true
      lovis4u_collect_pdfs: false

logger:
  log_dir: "data/checkpoints/phage_grpo_logs"
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: true

cluster:
  gpus_per_node: 2
  num_nodes: 1
