# Evo2 phage GDPO rollout config.
#
# GDPO uses the same NeMo-RL GRPO trainer frontend, but the phage environment
# returns a positional [B, K] reward tensor instead of the scalar aggregate.

defaults: "grpo_phage_megatron.yaml"

grpo:
  max_num_epochs: 500
  num_prompts_per_step: 1
  num_generations_per_prompt: 96
  max_num_steps: 500
  val_period: 10
  val_batch_size: 96
  max_val_samples: 96
  val_at_start: false
  val_at_end: true

loss_fn:
  # Conservative rollout setting: keep policy drift tighter than the smoke/base GRPO config.
  reference_policy_kl_penalty: 0.05

policy:
  train_global_batch_size: 96
  train_micro_batch_size: 1
  generation_batch_size: 96
  logprob_batch_size: 1
  megatron_cfg:
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-7
    scheduler:
      lr_warmup_init: 1.0e-7
  generation:
    max_new_tokens: 5989
    temperature: 1.0
    top_p: 1.0
    top_k: 4
    mcore_generation_config:
      cuda_graph_impl: "local"
      inference_cuda_graph_scope: "block"
      use_cuda_graphs_for_non_decode_steps: true
      max_requests: 96
      prompt_batch_size: 96
      enable_chunked_prefill: false
      generation_adapter: "bionemo.evo2_phage_gen.nemo_rl_evo2_generation:Evo2MegatronGenerationAdapter"
      generation_adapter_config:
        seed_stride: 1000003

data:
  train:
    data_path: "data/phage_prompts_paper_useful_rl.jsonl"
  validation:
    dataset_name: "openai_format"
    data_path: "data/phage_prompts_paper_useful_rl_validation_prompt10.jsonl"
    env_name: "phage_qc"
    prompt_file: null
    system_prompt_file: null

env:
  phage_qc:
    dustmask_filter: true
    dustmasker_bin: "dustmasker"
    dustmask_use_external: true
    dustmask_window: 64
    dustmask_level: 20.0
    dustmask_end_window: 200
    dustmask_max_end_fraction: 0.9
    reward_output_mode: "gdpo"
    weight_valid_nt_chars: 1.0
    weight_genome_length: 1.0
    weight_gc_content: 1.0
    weight_nt_homopolymer: 1.0
    weight_dustmask_end: 1.0
    weight_nucleotide_pass: 1.0
    weight_protein_hit_count: 1.0
    weight_tropism: 1.0
    weight_synteny: 0.25
    weight_average_protein_identity: 0.25
    weight_required_genes: 0.1
    weight_mmseqs_cluster_diversity: 1.0
    gdpo_objectives:
      - name: "feasibility"
        reducer: "mean"
        columns:
          - "reward_valid_nt_chars"
          - "reward_genome_length"
          - "reward_gc_content"
          - "reward_nt_homopolymer"
          - "reward_dustmask_end"
          - "reward_nucleotide_pass"
      - name: "function"
        reducer: "mean"
        columns:
          - "reward_external_protein_hit_count"
          - "reward_external_tropism"
          - "reward_external_required_genes"
      - name: "architecture"
        reducer: "mean"
        columns:
          - "reward_external_synteny"
      - name: "novelty"
        reducer: "mean"
        columns:
          - "reward_external_average_protein_identity"
          - "reward_mmseqs_cluster_diversity"
    external_qc:
      enabled: true
      enable_protein_hit_count: true
      enable_tropism: true
      enable_synteny: true
      synteny_mode: "full"
      enable_average_protein_identity: true
      enable_required_genes: true
      required_genes_evidence_target: 9.0
      # Per external-QC reward run; set lower if several environment actors score concurrently.
      lovis4u_parallel_jobs: 12
      lovis4u_collect_pdfs: false
    mmseqs_cluster_diversity:
      enabled: true
      mmseqs_bin: "mmseqs"
      work_dir: "data/checkpoints/phage_gdpo_mmseqs_cluster_diversity"
      keep_artifacts: false
      min_seq_id: 0.99
      coverage: 0.0
      cov_mode: 0
      seq_id_mode: 0
      cluster_mode: 0
      threads: null

logger:
  log_dir: "data/checkpoints/phage_gdpo_logs"
  wandb_enabled: true
  wandb:
    project: "evo2_phage_design_rl_focused_qc"
    name: "gdpo-phage-rl500-full-qc-mmseqs-dustmask-lr1e-6-kl0.05-batched96"

checkpointing:
  checkpoint_dir: "data/checkpoints/phage_gdpo"
  metric_name: "val:phage_qc/binary_core_pass_cluster_deduplicated_rate"
  higher_is_better: true
