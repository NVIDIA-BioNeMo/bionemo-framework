# Current PhiX174 case-study defaults. Supplying this file explicitly bypasses
# the fresh-calibration compatibility check; see examples/README.md.
temperature: 1.0
top_k: 5
top_p: 0.999
# Total caps are 5,436-5,444 nt, 10-18 nt past the length reward's upper zero;
# sampled EOD may terminate earlier.
max_new_tokens: 5420
prompt_lengths:
  - 16
  - 24
prompt_anchors:
  - name: origin
    start_1_based: 1
  - name: before_g
    start_1_based: 2387
  - name: after_h
    start_1_based: 3918
  - name: a_cluster_start
    start_1_based: 3973
rl_seed: 42
rollout_seed: 7
seed_stride: 1000003
